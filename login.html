<!-- SPA login entry. Provider links get their API href from src/pages/login.js. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Strict CSP (defense-in-depth behind DOMPurify). The inline theme pre-paint
    script below is allowlisted by hash; if you edit it, regenerate the hash
    over the exact text between <script> and </script> (whitespace included):
    echo -n "<text>" | openssl dgst -sha256 -binary | base64
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'sha256-4+6RWo6MeqAtL87UQzFFIrIIJKvSU11ZWcQdyKuKCeQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.yuzuki.space http://localhost:5000 http://127.0.0.1:5000 ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'"
  >
  <meta name="description" content="Sign in to Yuzu Companion — your AI companion app.">
  <title>Login | Yuzu Companion</title>
  <link rel="stylesheet" href="/src/styles/style.css">
  <link rel="stylesheet" href="/src/styles/theme.css">
  <link rel="stylesheet" href="/src/styles/login.css">
  <script>
    (() => {
      const theme = localStorage.getItem("theme") || "stellar-night-suisei";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body class="login-body">
  <main class="login-page page-frame" aria-label="Sign in">
    <section class="login-container" aria-labelledby="login-heading">
      <h1 class="login-title" id="login-heading">Yuzu Companion</h1>
      <p class="login-subtitle">Sign in to continue</p>

      <!-- biome-ignore lint/a11y/useSemanticElements: role="group" is the intended button-group pattern (ported markup) -->
      <div class="login-buttons" role="group" aria-label="Sign-in options">
        <a href="https://api.yuzuki.space/v1/auth/login?provider=google"
           data-auth-provider="google"
           class="login-btn btn-google"
           aria-label="Sign in with Google">
          <img src="/assets/logos/providers/google.svg" width="20" height="20" alt="" aria-hidden="true">
          Sign in with Google
        </a>
        <a href="https://api.yuzuki.space/v1/auth/login?provider=github"
           data-auth-provider="github"
           class="login-btn btn-github"
           aria-label="Sign in with GitHub">
          <img src="/assets/logos/providers/github.svg" width="20" height="20" alt="" aria-hidden="true">
          Sign in with GitHub
        </a>
      </div>
    </section>
  </main>

  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
